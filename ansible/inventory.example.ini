# ==============================================================================
# Example Ansible Inventory for PHP2Shell Detection
# ==============================================================================

[plesk_servers]
plesk01.example.com ansible_host=192.168.1.10 ansible_user=root
plesk02.example.com ansible_host=192.168.1.11 ansible_user=root

[hestia_servers]
hestia01.example.com ansible_host=192.168.1.20 ansible_user=root

[ispconfig_servers]
ispconfig01.example.com ansible_host=192.168.1.30 ansible_user=root

[standalone_servers]
web01.example.com ansible_host=192.168.1.40 ansible_user=root
web02.example.com ansible_host=192.168.1.41 ansible_user=root

[webservers:children]
plesk_servers
hestia_servers
ispconfig_servers
standalone_servers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
