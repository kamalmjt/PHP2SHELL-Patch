---
# ==============================================================================
# Ansible Playbook: Detect PHP2Shell Vulnerabilities (CVE-2026-109618 & CVE-2026-109619)
#
# Audits all PHP binaries across managed hosts:
#   - PHP CLI binaries (/usr/bin/php*, /opt/plesk/php/*/bin/php, /opt/php-*/bin/php)
#   - PHP-FPM binaries (/usr/sbin/php-fpm*, /opt/plesk/php/*/sbin/php-fpm, etc.)
#   - Apache mod_php modules (libphp*.so)
#
# Flags:
#   - Vulnerable versions below official patches: 8.2.35+, 8.3.36+, 8.4.27+, 8.5.12+
#   - Legacy End-of-Life (EOL) versions: PHP 5.x, 7.x, 8.0, 8.1
#   - Active exploitation vectors: session.upload_progress.enabled == ON
#   - PHP 8.5 Use-After-Free vector: fatal_error_backtraces == ON
#   - OOM parser corruption traps: post_max_size >= memory_limit (CVE-2026-109618)
#
# Author: Kamal Majaiti EL Majaiti
# ==============================================================================

- name: Audit hosts for PHP2Shell Vulnerabilities (CVE-2026-109618 & CVE-2026-109619)
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Set to true to fail the playbook if any vulnerable PHP version is detected
    fail_on_vulnerable: false

    # Save a JSON audit report on each remote host
    save_remote_report: true
    remote_report_path: "/var/log/php2shell-audit.json"

    # Fetch audit reports back to the Ansible controller machine
    fetch_local_report: false
    local_report_dir: "./reports"

  tasks:
    - name: Verify python3 interpreter is available on target
      ansible.builtin.command: python3 --version
      register: python_check
      changed_when: false
      failed_when: python_check.rc != 0

    - name: Copy audit script to managed node
      ansible.builtin.copy:
        src: audit_php2shell.py
        dest: /tmp/audit_php2shell.py
        owner: root
        group: root
        mode: '0700'

    - name: Execute PHP2Shell vulnerability audit
      ansible.builtin.command: python3 /tmp/audit_php2shell.py --json
      register: php_audit_raw
      changed_when: false

    - name: Parse audit JSON data
      ansible.builtin.set_fact:
        php_audit: "{{ php_audit_raw.stdout | from_json }}"

    - name: Display host audit summary banner
      ansible.builtin.debug:
        msg:
          - "================================================================================"
          - " HOST AUDIT: {{ inventory_hostname }} ({{ php_audit.hostname }})"
          - " STATUS: {{ 'VULNERABLE' if php_audit.is_vulnerable else 'SECURE / PATCHED' }}"
          - " TOTAL BINARIES CHECKED: {{ php_audit.summary.total_binaries }}"
          - " PATCHED BINARIES       : {{ php_audit.summary.patched }}"
          - " VULNERABLE BINARIES    : {{ php_audit.summary.vulnerable }} ({{ php_audit.summary.vulnerable_eol }} EOL, {{ php_audit.summary.vulnerable_unpatched }} unpatched)"
          - " UPLOAD PROGRESS ACTIVE : {{ php_audit.summary.upload_progress_active }}"
          - " OOM RISK TRAIL         : {{ php_audit.summary.oom_risk_count }}"
          - "================================================================================"

    - name: Display detailed findings for each binary
      ansible.builtin.debug:
        msg: >-
          [{{ item.status | default('UNKNOWN') }}] {{ (item.type | default('bin')) | upper }} => {{ item.path | default('unknown') }}
          (Version: {{ item.version | default('unknown') }})
          {% if item.target_version | default('') %} | Requires: >={{ item.target_version }}{% endif %}
          {% if item.upload_progress_enabled | default(false) %} | ALERT: session.upload_progress.enabled is ON!{% endif %}
          {% if item.fatal_error_backtraces | default(false) %} | ALERT: fatal_error_backtraces is ON!{% endif %}
          {% if item.oom_risk | default(false) %} | ALERT: {{ item.oom_details | default('OOM risk detected') }}{% endif %}
      loop: "{{ php_audit.findings | default([]) }}"
      loop_control:
        label: "{{ item.path | default('bin') }} ({{ item.version | default('unknown') }})"
      when:
        - php_audit is defined
        - php_audit.findings is defined
        - php_audit.findings | length > 0

    - name: Display critical advisory if vulnerable versions are present
      ansible.builtin.debug:
        msg:
          - ">>> CRITICAL SECURITY NOTICE FOR {{ inventory_hostname }} <<<"
          - "Detected {{ php_audit.summary.vulnerable }} vulnerable PHP installation(s)."
          - "Configuration stopgaps (such as php2shellfix.sh) must be applied immediately."
          - "The definitive solution is upgrading packages to: 8.2.35+, 8.3.36+, 8.4.27+, 8.5.12+."
          - "For EOL PHP (5.x, 7.x, 8.0, 8.1), no official patches exist; rely on pool locking & WAF."
      when: php_audit.is_vulnerable

    - name: Save JSON report on remote host
      ansible.builtin.copy:
        content: "{{ php_audit_raw.stdout }}"
        dest: "{{ remote_report_path }}"
        owner: root
        group: root
        mode: '0640'
      when: save_remote_report

    - name: Ensure local report directory exists on controller
      ansible.builtin.file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
      when: fetch_local_report
      run_once: true

    - name: Fetch report to Ansible controller
      ansible.builtin.fetch:
        src: "{{ remote_report_path }}"
        dest: "{{ local_report_dir }}/{{ inventory_hostname }}-php2shell-audit.json"
        flat: true
      when: fetch_local_report and save_remote_report

    - name: Clean up temporary audit script on managed node
      ansible.builtin.file:
        path: /tmp/audit_php2shell.py
        state: absent

    - name: Fail task if vulnerable PHP was detected and fail_on_vulnerable is set
      ansible.builtin.fail:
        msg: "Vulnerable PHP installations found on {{ inventory_hostname }}. See audit details above."
      when:
        - fail_on_vulnerable | bool
        - php_audit.is_vulnerable | bool

# ==============================================================================
# Final Aggregated Playbook Recap & Central Log Report Generation
# ==============================================================================
- name: PHP2Shell Vulnerability Fleet Recap & Reporting
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    local_report_dir: "./reports"
    local_log_file: "./reports/php2shell-audit-report.log"
    local_vuln_hosts_file: "./reports/vulnerable-hosts.txt"
    also_write_root_log: true

  tasks:
    - name: Categorize hosts by vulnerability status
      vars:
        audited_hosts: "{{ ansible_play_hosts_all | default(groups['all']) | default([]) }}"
      ansible.builtin.set_fact:
        fleet_audited_hosts: "{{ audited_hosts }}"
        fleet_vuln_hosts: >-
          {%- set vuln_list = [] -%}
          {%- for h in audited_hosts -%}
            {%- if hostvars[h] is defined and hostvars[h].php_audit is defined and hostvars[h].php_audit.is_vulnerable | default(false) -%}
              {%- set _ = vuln_list.append(h) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ vuln_list }}
        fleet_clean_hosts: >-
          {%- set clean_list = [] -%}
          {%- for h in audited_hosts -%}
            {%- if hostvars[h] is defined and hostvars[h].php_audit is defined and not (hostvars[h].php_audit.is_vulnerable | default(false)) -%}
              {%- set _ = clean_list.append(h) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ clean_list }}
        fleet_unreach_hosts: >-
          {%- set unreach_list = [] -%}
          {%- for h in audited_hosts -%}
            {%- if hostvars[h] is not defined or hostvars[h].php_audit is not defined -%}
              {%- set _ = unreach_list.append(h) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ unreach_list }}

    - name: Ensure local reports directory exists
      ansible.builtin.file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: '0755'

    - name: Generate consolidated human-readable audit log report
      ansible.builtin.copy:
        content: |
          ================================================================================
                    PHP2SHELL FLEET AUDIT REPORT (CVE-2026-109618 & CVE-2026-109619)
          ================================================================================
          Total Hosts Evaluated : {{ fleet_audited_hosts | length }}
          Clean / Patched Hosts : {{ fleet_clean_hosts | length }}
          Vulnerable Hosts      : {{ fleet_vuln_hosts | length }}
          Unreachable / Failed  : {{ fleet_unreach_hosts | length }}
          ================================================================================

          {%- if fleet_vuln_hosts | length > 0 %}
          --------------------------------------------------------------------------------
                                VULNERABLE SERVERS & BINARIES
          --------------------------------------------------------------------------------
          {% for h in fleet_vuln_hosts %}
          [!] HOST: {{ h }}
              Total Vulnerable Binaries: {{ hostvars[h].php_audit.summary.vulnerable | default(1) }}
          {%- for f in hostvars[h].php_audit.findings | default([]) %}
            {%- if f.status in ['VULNERABLE_EOL', 'VULNERABLE_UNPATCHED'] %}
                * [{{ f.status }}] {{ f.type | upper }} => {{ f.path }} (Version: {{ f.version }})
                  {%- if f.target_version | default('') %} | Target: >= {{ f.target_version }}{% endif %}
                  {%- if f.upload_progress_enabled | default(false) %} | ALERT: session.upload_progress.enabled is ON!{% endif %}
                  {%- if f.fatal_error_backtraces | default(false) %} | ALERT: fatal_error_backtraces is ON!{% endif %}
                  {%- if f.oom_risk | default(false) %} | ALERT: {{ f.oom_details }}{% endif %}
            {%- endif %}
          {%- endfor %}

          {% endfor %}
          {%- else %}
          No vulnerable servers detected across the fleet.
          {%- endif %}

          --------------------------------------------------------------------------------
                                   CLEAN / PATCHED SERVERS
          --------------------------------------------------------------------------------
          {% for h in fleet_clean_hosts %}
            [OK] {{ h }} (Binaries: {{ hostvars[h].php_audit.summary.total_binaries | default(0) }}, Patched: {{ hostvars[h].php_audit.summary.patched | default(0) }})
          {% endfor %}

          {%- if fleet_unreach_hosts | length > 0 %}
          --------------------------------------------------------------------------------
                                   UNREACHABLE / FAILED SERVERS
          --------------------------------------------------------------------------------
          {% for h in fleet_unreach_hosts %}
            [UNREACHABLE / FAILED] {{ h }}
          {% endfor %}
          {% endif %}

          ================================================================================
                                       RECOMMENDED ACTIONS
          ================================================================================
          1. For supported branches (PHP 8.2+):
             Upgrade packages immediately to >= 8.2.35, >= 8.3.36, >= 8.4.27, >= 8.5.12.
          2. For legacy EOL software (PHP 5.x, 7.x, 8.0, 8.1):
             Run php2shellfix.sh on vulnerable servers to lock PHP-FPM pools with
             php_admin_flag, set pm.max_requests = 500, deploy drop-ins, and restart services:
               sudo ./php2shellfix.sh
          ================================================================================
        dest: "{{ local_log_file }}"
        mode: '0644'

    - name: Also write report to current directory for immediate access
      ansible.builtin.copy:
        content: "{{ lookup('file', local_log_file) }}"
        dest: "./php2shell-audit-report.log"
        mode: '0644'
      when: also_write_root_log | bool

    - name: Generate list of vulnerable hostnames (for targeting remediations)
      ansible.builtin.copy:
        content: |
          {% for h in fleet_vuln_hosts %}
          {{ h }}
          {% endfor %}
        dest: "{{ local_vuln_hosts_file }}"
        mode: '0644'

    - name: Display fleet recap banner on console
      ansible.builtin.debug:
        msg: |
          ================================================================================
                              PHP2SHELL FLEET AUDIT RECAP                                
          ================================================================================
           Total Hosts Evaluated : {{ fleet_audited_hosts | length }}
           Clean / Patched Hosts : {{ fleet_clean_hosts | length }}
           Vulnerable Hosts      : {{ fleet_vuln_hosts | length }}
           Unreachable / Failed  : {{ fleet_unreach_hosts | length }}
          {%- if fleet_vuln_hosts | length > 0 %}
           Vulnerable Host List  : {{ fleet_vuln_hosts | join(', ') }}
          {%- else %}
           All audited hosts are clean or patched.
          {%- endif %}
          {%- if fleet_unreach_hosts | length > 0 %}
           Unreachable Hosts     : {{ fleet_unreach_hosts | join(', ') }}
          {%- endif %}
          ================================================================================
           AUDIT REPORT SAVED TO : {{ local_log_file }} (and ./php2shell-audit-report.log)
           VULNERABLE HOSTS LIST : {{ local_vuln_hosts_file }}
          ================================================================================
